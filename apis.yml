aid: newgen-software
name: Newgen Software
description: 'Newgen Software is a global provider of NewgenONE, a unified low-code
  digital transformation platform that orchestrates content services (enterprise content
  management), business process management (BPM/workflow), and customer communication
  management (CCM) for banks, insurers, government agencies, and healthcare organizations.
  Founded in 1992 and headquartered in New Delhi, India, the company is publicly listed
  (NSE/BSE) and serves enterprises worldwide with document management, intelligent
  document processing, case management, and process automation. Platform capabilities
  are exposed to customers and system integrators via REST APIs, but Newgen does not
  operate a public, self-service developer portal or publish OpenAPI/SDK artifacts
  on its marketing site.'
